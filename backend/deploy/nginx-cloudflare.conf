# ==============================================================================
# Nginx Configuration for Locket Gold (Cloudflare-fronted with Origin CA)
# Path: /etc/nginx/sites-available/locket-gold-cloudflare
# ==============================================================================

# Rate limiting zones (keyed on real client IP passed by Cloudflare)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=refresh_limit:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=queue_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=reviews_limit:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;


# --- Real client IP restoration from Cloudflare edge proxies ---
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ---- HTTP Port 80 -> Permanent Redirect to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS Port 443 (Cloudflare Full / Strict SSL with Origin CA Certificate) ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # Cloudflare Origin CA Certificate and Private Key
    ssl_certificate     /etc/ssl/certs/cloudflare_origin.pem;
    ssl_certificate_key /etc/ssl/private/cloudflare_origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Max body size (Server-wide limit to prevent DoS)
    # Allows one 5MB KOL screenshot plus multipart overhead. Review uploads
    # receive their own tighter route/rate policy below.
    client_max_body_size 8M;


    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 1. Frontend SPA Root Directory (built dist/)
    root /var/www/locket-gold;
    index index.html;

    # Static assets with long-term cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 2. Strict Rate Limiting for Auth Mutation (Login / Register)
    location ~* ^/api/auth/(login|register)$ {
        limit_req zone=auth_limit burst=3 nodelay;

        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Set-Cookie;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # 3. Dedicated Rate Limiting for Token Refresh
    location /api/auth/refresh {
        limit_req zone=refresh_limit burst=5 nodelay;

        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Set-Cookie;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # 4. Dedicated Rate Limiting for Queue Polling
    location /api/queue/ {
        limit_req zone=queue_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Set-Cookie;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # 5. General Backend API Routes
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Set-Cookie;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # 5.5. Dedicated Rate Limiting & Max Body for Review Mutations (POST /api/reviews, PUT/DELETE /api/reviews/me)
    location ~* ^/api/reviews(/me)?$ {
        client_max_body_size 26M;
        limit_req zone=reviews_limit burst=5 nodelay;
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Set-Cookie;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 5.6. Dedicated Admin REST API Route (Token + Role authenticated)
    location /api/admin/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Set-Cookie;

        add_header Cache-Control "private, no-store" always;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # 6. Legacy Admin API fallback. /admin/login is intentionally handled by
    # the React SPA so users and administrators share the same login page.
    location ~* ^/admin/(logout|api)/? {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_pass_header Set-Cookie;
    }

    # 7. Internal Protected Downloads (X-Accel-Redirect for mobileconfig and APK)
    location /protected_downloads/ {
        internal;
        alias /var/lib/locket-gold/downloads/;
    }

    # 7.5. Internal Protected Review Images (X-Accel-Redirect)
    location /protected_reviews/ {
        internal;
        alias /var/lib/locket-gold/reviews/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 8. SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
